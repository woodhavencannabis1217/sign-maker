<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Woodhaven Sign Maker</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; color:#fff; font-family:Arial,sans-serif; display:flex; height:100vh; overflow:hidden; }

/* ── LEFT PANEL ── */
#panel { width:460px; min-width:420px; background:#111; border-right:2px solid #1a3a1a; display:flex; flex-direction:column; overflow:hidden; }
#panel-header { background:#0d1f0d; padding:16px 20px; border-bottom:1px solid #1a3a1a; }
#panel-header h1 { color:#22c55e; font-size:18px; font-weight:900; letter-spacing:2px; }
#panel-header p  { color:#666; font-size:12px; margin-top:3px; }

#slides-list { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }

.slide-card { background:#1a1a1a; border:1px solid #2a2a2a; border-radius:12px; overflow:hidden; cursor:pointer; transition:border-color .2s; }
.slide-card:hover { border-color:#22c55e; }
.slide-card.active { border-color:#22c55e; background:#0c1e0c; }
.slide-card-header { display:flex; align-items:center; gap:10px; padding:12px 15px; background:rgba(34,197,94,0.07); }
.slide-num { background:#22c55e; color:#000; width:26px; height:26px; border-radius:50%; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.slide-title { font-size:13px; font-weight:700; color:#22c55e; }
.slide-preview-text { font-size:11px; color:#666; margin-top:2px; }
.slide-remove-btn { margin-left:auto; flex-shrink:0; background:transparent; color:#555; border:1px solid #333; border-radius:6px; width:26px; height:26px; font-size:14px; line-height:1; cursor:pointer; transition:all .2s; }
.slide-remove-btn:hover { background:#dc2626; color:#fff; border-color:#dc2626; }

.slide-fields {
  padding:14px; display:none; flex-direction:column; gap:10px;
  max-height:180px; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:#22c55e55 transparent;
}
.slide-fields::-webkit-scrollbar { width:5px; }
.slide-fields::-webkit-scrollbar-track { background:transparent; }
.slide-fields::-webkit-scrollbar-thumb { background:#22c55e66; border-radius:4px; }
.slide-fields::-webkit-scrollbar-thumb:hover { background:#22c55eaa; }
.slide-card.active .slide-fields { display:flex; }
/* Carousel has its own internal scroll — don't constrain the outer box */
.slide-fields.carousel-fields { max-height:none; overflow-y:visible; }

label { font-size:11px; color:#777; margin-bottom:3px; display:block; text-transform:uppercase; letter-spacing:.4px; }
input[type=text], textarea {
  width:100%; background:#0d0d0d; border:1px solid #2e2e2e; border-radius:7px;
  color:#fff; font-size:13px; padding:9px 11px; outline:none;
  transition:border-color .2s; font-family:Arial,sans-serif; resize:vertical;
}
input[type=text]:focus, textarea:focus { border-color:#22c55e; }
.field { display:flex; flex-direction:column; }
select { background:#0d0d0d; border:1px solid #2e2e2e; border-radius:7px; color:#fff; font-size:13px; padding:9px 11px; outline:none; width:100%; }

/* ── BOTTOM BAR ── */
#bottom-bar { padding:14px 18px; background:#0d1f0d; border-top:1px solid #1a3a1a; display:flex; flex-direction:column; gap:10px; }
#dur-row { display:flex; align-items:center; gap:10px; font-size:12px; color:#777; }
#dur-row input[type=range] { flex:1; accent-color:#22c55e; }
#dur-row span { color:#22c55e; font-weight:700; min-width:30px; text-align:right; }
#recBtn { background:#22c55e; color:#000; border:none; border-radius:8px; padding:15px; font-size:15px; font-weight:900; cursor:pointer; letter-spacing:1px; width:100%; transition:background .2s; }
#recBtn:hover:not(:disabled) { background:#4ade80; }
#recBtn:disabled { background:#333; color:#666; cursor:default; }
#status { font-size:12px; color:#22c55e; text-align:center; min-height:16px; }

/* ── RIGHT PANEL ── */
#preview-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; gap:12px; padding:20px; }
#preview-label { color:#444; font-size:12px; letter-spacing:2px; }
canvas { border:1px solid #1a3a1a; border-radius:4px; max-width:100%; }

/* ── CAROUSEL EDITOR ── */
.carousel-note { font-size:12px; color:#666; line-height:1.6; padding-bottom:8px; }

.prod-scroll-wrap {
  max-height: 260px;
  overflow-y: auto;
  overflow-x: hidden;
  border-radius: 10px;
  /* subtle gradient hint that there's more below */
  background:
    linear-gradient(#0c1e0c 30%, transparent) center top,
    linear-gradient(transparent, #0c1e0c 70%) center bottom;
  background-attachment: local, local;
  background-size: 100% 24px;
  background-repeat: no-repeat;
  scrollbar-width: thin;
  scrollbar-color: #22c55e44 transparent;
}
.prod-scroll-wrap::-webkit-scrollbar { width: 5px; }
.prod-scroll-wrap::-webkit-scrollbar-track { background: transparent; }
.prod-scroll-wrap::-webkit-scrollbar-thumb { background: #22c55e55; border-radius: 4px; }
.prod-scroll-wrap::-webkit-scrollbar-thumb:hover { background: #22c55e99; }

.prod-list { display:flex; flex-direction:column; gap:10px; padding: 2px 2px 4px 2px; }

.prod-item { background:#141414; border:1px solid #252525; border-radius:12px; overflow:hidden; }
.prod-item-top { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #1e1e1e; }
.prod-thumb-wrap { flex-shrink:0; }
.prod-thumb { width:72px; height:72px; object-fit:contain; border-radius:8px; border:2px solid #2e2e2e; background:#181818; cursor:pointer; display:block; transition:border-color .2s; }
.prod-thumb:hover { border-color:#22c55e; }
.prod-thumb-empty { width:72px; height:72px; border-radius:8px; border:2px dashed #333; background:#111; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:26px; cursor:pointer; gap:3px; transition:border-color .2s; }
.prod-thumb-empty span { font-size:10px; color:#555; letter-spacing:.5px; }
.prod-thumb-empty:hover { border-color:#22c55e; }
.prod-top-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.prod-name-input { width:100%; background:#0d0d0d; border:1px solid #2e2e2e; border-radius:7px; color:#fff; font-size:14px; font-weight:700; padding:8px 11px; outline:none; font-family:Arial,sans-serif; transition:border-color .2s; }
.prod-name-input:focus { border-color:#22c55e; }
.prod-remove { background:transparent; color:#555; border:1px solid #333; border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px; font-weight:700; white-space:nowrap; transition:all .2s; align-self:flex-start; }
.prod-remove:hover { background:#dc2626; color:#fff; border-color:#dc2626; }

.prod-item-body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
.prod-row { display:flex; gap:8px; align-items:flex-end; }
.prod-row .field { flex:1; }
.prod-color-wrap { display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; }
.prod-color-wrap label { font-size:10px; }
.prod-color { width:46px; height:36px; border:1px solid #333; border-radius:6px; cursor:pointer; padding:2px; background:#0d0d0d; }

.add-prod-btn { background:rgba(34,197,94,0.07); color:#22c55e; border:1px dashed #22c55e; border-radius:10px; padding:13px; font-size:13px; font-weight:700; cursor:pointer; width:100%; text-align:center; margin-top:4px; transition:background .2s; letter-spacing:.5px; }
.add-prod-btn:hover { background:rgba(34,197,94,0.15); }
input[type=file] { display:none; }
</style>
</head>
<body>

<div id="panel">
  <div id="panel-header">
    <h1>SIGN MAKER</h1>
    <p>Edit your slides · click Record · get video</p>
  </div>
  <div id="slides-list"></div>
  <div id="bottom-bar">
    <div id="dur-row">
      <span>Each slide shows for</span>
      <input type="range" id="durSlider" min="4" max="15" value="7" step="1">
      <span id="durVal">7s</span>
    </div>
    <button id="recBtn">⏺ &nbsp;RECORD &amp; DOWNLOAD VIDEO</button>
    <div id="status"></div>
  </div>
</div>

<div id="preview-wrap">
  <div id="preview-label">LIVE PREVIEW · 1080 × 1920 (portrait)</div>
  <canvas id="c"></canvas>
</div>

<script>
// ═══════════════════════════════════════════════════
//  CAROUSEL PRODUCTS — dynamic, unlimited
// ═══════════════════════════════════════════════════
let carouselProducts = [
  { name:'Best Buds', brand:'Edie Parker', type:'PRE-ROLLS', tag:'HAPPINESS HOUR', accent:'#e63946', img:null },
  { name:'Black Magic', brand:'Fernway', type:'INDICA · VAPE', tag:'STAFF PICK', accent:'#48cae4', img:null },
  { name:'Alpine Strawberry', brand:'Fernway', type:'SATIVA · VAPE', tag:'WILD · JUICY', accent:'#ff006e', img:null },
];

// ═══════════════════════════════════════════════════
//  SLIDE DEFINITIONS
// ═══════════════════════════════════════════════════
const SLIDE_DEFS = [
  {
    id:0, name:'🟢  OPEN NOW', type:'standard',
    fields:[
      { key:'top',    label:'Top line',   val:'WOODHAVEN CANNABIS CO' },
      { key:'main',   label:'Big text',   val:'OPEN' },
      { key:'sub',    label:'Sub text',   val:'NOW' },
      { key:'bottom', label:'Bottom line',val:'WALK IN  ·  NO APPOINTMENT NEEDED' },
    ],
  },
  {
    id:1, name:'🎠  PRODUCT CAROUSEL', type:'carousel',
    fields:[],
  },
  {
    id:2, name:'👋  COME IN', type:'standard',
    fields:[
      { key:'top',     label:'Top line',   val:"QUEENS' FAVORITE DISPENSARY" },
      { key:'line1',   label:'Big line 1', val:'STOP IN' },
      { key:'line2',   label:'Big line 2', val:'& SEE US' },
      { key:'tagline', label:'Tagline',    val:'Friendly Staff  ·  Premium Products' },
      { key:'bottom',  label:'Bottom',     val:'LICENSED & LEGAL  ·  NEW YORK STATE' },
    ],
  },
  {
    id:4, name:'🔞  21+ WELCOME', type:'standard',
    fields:[
      { key:'top',  label:'Top line',  val:'NEW YORK STATE LICENSED' },
      { key:'big',  label:'Big text',  val:'21+' },
      { key:'sub',  label:'Sub text',  val:'WELCOME' },
      { key:'tag1', label:'Tag left',  val:'RECREATIONAL' },
      { key:'tag2', label:'Tag right', val:'MEDICINAL' },
    ],
  },
];

// ═══════════════════════════════════════════════════
//  BUILD EDIT PANEL
// ═══════════════════════════════════════════════════
let activeSlide = 0;
const listEl = document.getElementById('slides-list');

function buildPanel() {
  listEl.innerHTML = '';
  SLIDE_DEFS.forEach((slide, idx) => {
    const card = document.createElement('div');
    card.className = 'slide-card' + (idx === activeSlide ? ' active' : '');
    card.dataset.idx = idx;

    const previewText = slide.type === 'carousel'
      ? carouselProducts.length + ' products'
      : (slide.fields[0]?.val || '');

    card.innerHTML = `
      <div class="slide-card-header">
        <div class="slide-num">${idx+1}</div>
        <div>
          <div class="slide-title">${slide.name}</div>
          <div class="slide-preview-text">${previewText}</div>
        </div>
        <button class="slide-remove-btn" title="Remove slide">✕</button>
      </div>
      <div class="slide-fields" id="fields-${idx}"></div>
    `;

    const header = card.querySelector('.slide-card-header');
    const fieldsEl = card.querySelector('.slide-fields');
    const removeBtn = card.querySelector('.slide-remove-btn');

    header.addEventListener('click', () => {
      document.querySelectorAll('.slide-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      activeSlide = idx;
    });

    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (SLIDE_DEFS.length <= 1) { alert('You need at least 1 slide.'); return; }
      if (!confirm(`Remove slide "${slide.name}"?`)) return;
      const removedIdx = SLIDE_DEFS.indexOf(slide);
      SLIDE_DEFS.splice(removedIdx, 1);
      if (activeSlide >= SLIDE_DEFS.length) activeSlide = SLIDE_DEFS.length - 1;
      else if (activeSlide > removedIdx) activeSlide--;
      saveState();
      buildPanel();
    });

    if (slide.type === 'carousel') {
      fieldsEl.classList.add('carousel-fields');
      buildCarouselEditor(fieldsEl);
    } else {
      slide.fields.forEach(f => {
        const div = document.createElement('div');
        div.className = 'field';
        div.innerHTML = `<label>${f.label}</label><input type="text" value="${f.val}">`;
        const inp = div.querySelector('input');
        inp.addEventListener('input', () => { f.val = inp.value; saveState(); });
        fieldsEl.appendChild(div);
      });
    }

    listEl.appendChild(card);
  });
}

// ── CAROUSEL EDITOR ─────────────────────────────
function buildCarouselEditor(container) {
  container.innerHTML = '';

  const note = document.createElement('div');
  note.className = 'carousel-note';
  note.textContent = 'Click a photo slot to upload. Add as many products as you want.';
  container.appendChild(note);

  // Add-product button lives at the TOP, above the scrolling list, so it's
  // always visible without any scrolling (it was too easy to miss below).
  const addBtn = document.createElement('button');
  addBtn.className = 'add-prod-btn';
  addBtn.textContent = '➕  Add Another Product';
  container.appendChild(addBtn);

  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'prod-scroll-wrap';
  container.appendChild(scrollWrap);

  const prodListEl = document.createElement('div');
  prodListEl.className = 'prod-list';
  scrollWrap.appendChild(prodListEl);

  function mkInput(placeholder, val, onChange, bold) {
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = placeholder; inp.value = val;
    if (bold) { inp.className = 'prod-name-input'; }
    inp.addEventListener('input', () => { onChange(inp.value); saveState(); });
    return inp;
  }

  function mkField(labelTxt, inp) {
    const d = document.createElement('div'); d.className = 'field';
    const l = document.createElement('label'); l.textContent = labelTxt;
    d.appendChild(l); d.appendChild(inp); return d;
  }

  function renderProdList() {
    prodListEl.innerHTML = '';
    carouselProducts.forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'prod-item';

      // ── TOP ROW: thumbnail + name + remove ──
      const top = document.createElement('div');
      top.className = 'prod-item-top';

      // Thumbnail / file input
      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'prod-thumb-wrap';
      const fileInput = document.createElement('input');
      fileInput.type = 'file'; fileInput.accept = 'image/*';

      let thumb;
      if (p.img) {
        thumb = document.createElement('img');
        thumb.className = 'prod-thumb';
        thumb.src = p.img.src;
        thumb.title = 'Click to change photo';
      } else {
        thumb = document.createElement('div');
        thumb.className = 'prod-thumb-empty';
        thumb.innerHTML = '📷<span>TAP TO ADD</span>';
      }
      thumb.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', e => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => { carouselProducts[i].img = img; saveState(); renderProdList(); };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      thumbWrap.appendChild(thumb);
      thumbWrap.appendChild(fileInput);

      // Name + remove btn
      const topInfo = document.createElement('div');
      topInfo.className = 'prod-top-info';
      const nameInp = mkInput('Product name', p.name, v => p.name = v, true);
      topInfo.appendChild(nameInp);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'prod-remove';
      removeBtn.textContent = '✕ Remove';
      removeBtn.addEventListener('click', () => {
        if (carouselProducts.length > 1) { carouselProducts.splice(i, 1); saveState(); renderProdList(); }
      });
      topInfo.appendChild(removeBtn);

      top.appendChild(thumbWrap);
      top.appendChild(topInfo);

      // ── BODY: brand / type / tag / color ──
      const body = document.createElement('div');
      body.className = 'prod-item-body';

      // Row 1: Brand + Type
      const row1 = document.createElement('div'); row1.className = 'prod-row';
      row1.appendChild(mkField('Brand', mkInput('e.g. Fernway', p.brand, v => p.brand = v)));
      row1.appendChild(mkField('Type', mkInput('e.g. INDICA · VAPE', p.type, v => p.type = v)));
      body.appendChild(row1);

      // Row 2: Tag + Accent color
      const row2 = document.createElement('div'); row2.className = 'prod-row';
      row2.appendChild(mkField('Tag label', mkInput('e.g. STAFF PICK', p.tag, v => p.tag = v)));

      const colorWrap = document.createElement('div'); colorWrap.className = 'prod-color-wrap';
      const colorLabel = document.createElement('label'); colorLabel.textContent = 'Color';
      const colorPick = document.createElement('input');
      colorPick.type = 'color'; colorPick.className = 'prod-color'; colorPick.value = p.accent;
      colorPick.addEventListener('input', () => { p.accent = colorPick.value; saveState(); });
      colorWrap.appendChild(colorLabel); colorWrap.appendChild(colorPick);
      row2.appendChild(colorWrap);
      body.appendChild(row2);

      item.appendChild(top);
      item.appendChild(body);
      prodListEl.appendChild(item);
    });
  }

  addBtn.addEventListener('click', () => {
    const colors = ['#22c55e','#d4a227','#e63946','#48cae4','#ff006e','#a855f7','#f97316'];
    carouselProducts.push({
      name: 'Product ' + (carouselProducts.length + 1),
      brand: '', type: '', tag: 'IN STORE NOW',
      accent: colors[carouselProducts.length % colors.length],
      img: null,
    });
    saveState();
    renderProdList();
    // Scroll to bottom so user sees the new product
    setTimeout(() => { scrollWrap.scrollTop = scrollWrap.scrollHeight; }, 50);
  });

  renderProdList();
}

// ═══════════════════════════════════════════════════
//  PERSISTENCE — save/restore edits across refresh
// ═══════════════════════════════════════════════════
const STORAGE_KEY = 'woodhavenSignMakerState';

function saveState(){
  try{
    const data = {
      duration: document.getElementById('durSlider').value,
      slides: SLIDE_DEFS.map(s => ({
        id: s.id, name: s.name, type: s.type,
        fields: s.fields.map(f => ({ key:f.key, label:f.label, val:f.val })),
      })),
      products: carouselProducts.map(p => ({
        name:p.name, brand:p.brand, type:p.type, tag:p.tag, accent:p.accent,
        imgSrc: (p.img && p.img.src) ? p.img.src : null,
      })),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){ console.warn('Could not save sign maker state', e); }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);

    if(data.duration){
      document.getElementById('durSlider').value = data.duration;
      document.getElementById('durVal').textContent = data.duration+'s';
    }

    if(Array.isArray(data.slides) && data.slides.length){
      SLIDE_DEFS.length = 0;
      data.slides.forEach(s => SLIDE_DEFS.push(s));
    }

    if(Array.isArray(data.products)){
      carouselProducts.length = 0;
      data.products.forEach(p => {
        const prod = { name:p.name, brand:p.brand, type:p.type, tag:p.tag, accent:p.accent, img:null };
        carouselProducts.push(prod);
        if(p.imgSrc){
          const img = new Image();
          img.onload = () => { prod.img = img; buildPanel(); };
          img.src = p.imgSrc;
        }
      });
    }
  }catch(e){ console.warn('Could not load sign maker state', e); }
}

loadState();
buildPanel();

// ═══════════════════════════════════════════════════
//  CANVAS SETUP
// ═══════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W=1080, H=1920; // portrait — matches vertical poster-style kiosk displays
canvas.width=W; canvas.height=H;

function scaleCanvas(){
  const pw=document.getElementById('preview-wrap');
  const s=Math.min((pw.clientWidth-40)/W,(pw.clientHeight-60)/H);
  canvas.style.width=(W*s)+'px'; canvas.style.height=(H*s)+'px';
}
scaleCanvas();
window.addEventListener('resize',scaleCanvas);

// ═══════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════
const GREEN='#22c55e', GOLD='#d4a227', WHITE='#ffffff';
const G_RGB='34,197,94', GD_RGB='212,162,39';

function txt(text,x,y,font,color,glowColor,glowBlur,align='center'){
  if(!text) return;
  ctx.font=font; ctx.textAlign=align; ctx.textBaseline='middle';
  ctx.shadowColor=glowColor||color; ctx.shadowBlur=glowBlur||0;
  ctx.fillStyle=color; ctx.fillText(text,x,y); ctx.shadowBlur=0;
}
function line(x1,y1,x2,y2,color,op=1){
  ctx.save(); ctx.globalAlpha=op;
  ctx.strokeStyle=color; ctx.shadowColor=color; ctx.shadowBlur=8;
  ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.restore();
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}
function drawBg(){
  const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,'#030e05'); g.addColorStop(1,'#000');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let y=0;y<H;y+=4){ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(0,y,W,1);}
  const c='rgba(34,197,94,0.3)',sz=60;
  [[0,0],[W-sz,0],[0,H-sz],[W-sz,H-sz]].forEach(([x,y])=>{
    ctx.strokeStyle=c;ctx.lineWidth=2;ctx.shadowBlur=0;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+sz,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+sz);ctx.stroke();
  });
}
const PARTS=Array.from({length:70},()=>({
  x:Math.random()*W,y:Math.random()*H,vy:-(0.3+Math.random()*.5),
  r:.8+Math.random()*2.5,op:Math.random()*.5+.1,
  c:Math.random()>.65?GD_RGB:G_RGB,
}));
function drawParticles(){
  PARTS.forEach(p=>{
    p.y+=p.vy;if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*5);
    g.addColorStop(0,`rgba(${p.c},${p.op})`);g.addColorStop(1,`rgba(${p.c},0)`);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  });
}

// ═══════════════════════════════════════════════════
//  CAROUSEL RENDERING
// ═══════════════════════════════════════════════════
const HOLD_SECS=3.5, TRANS_SECS=0.65;
const CYCLE_SECS=HOLD_SECS+TRANS_SECS;

function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

// Shrinks a font size (in px) until `text` fits within maxWidth, so long
// product names/tags don't overflow the narrow portrait canvas.
function fitFontSize(text, weight, family, startPx, maxWidth, minPx=16){
  let size=startPx;
  ctx.font=`${weight} ${size}px ${family}`;
  while(size>minPx && ctx.measureText(text).width>maxWidth){
    size-=2;
    ctx.font=`${weight} ${size}px ${family}`;
  }
  return size;
}

// Portrait layout: one product filling the screen at a time, cross-fading
// into the next (a side-by-side coverflow doesn't fit a narrow vertical panel).
// The photo/glow/border cross-fade together, but the text label only ever
// belongs to whichever product is >50% opaque — blending two different
// product names/prices on top of each other mid-transition is unreadable.
function drawCarouselItem(p, opacity, showLabel=true){
  if(!p || opacity<=0.01) return;

  const IMG_W=W*0.78, IMG_H=IMG_W*0.98;
  const cx=W/2, cy=H*0.36;
  const dw=IMG_W, dh=IMG_H;
  const rx=cx-dw/2, ry=cy-dh/2, rr=26;

  ctx.save();
  ctx.globalAlpha=opacity;

  const r=parseInt(p.accent.slice(1,3),16),
        g2=parseInt(p.accent.slice(3,5),16),
        b=parseInt(p.accent.slice(5,7),16);

  // Colored glow behind product
  const gl=ctx.createRadialGradient(cx,cy,dh*.05,cx,cy,dh*.85);
  gl.addColorStop(0,`rgba(${r},${g2},${b},0.30)`);
  gl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gl;
  ctx.beginPath();ctx.ellipse(cx,cy,dw*.85,dh*.8,0,0,Math.PI*2);ctx.fill();

  // Draw image (no white card — direct on dark bg)
  ctx.save();
  roundRect(rx,ry,dw,dh,rr);
  ctx.clip();
  if(p.img && p.img.complete && p.img.naturalWidth>0){
    ctx.drawImage(p.img,rx,ry,dw,dh);
  } else {
    ctx.fillStyle=`rgba(${r},${g2},${b},0.25)`;
    ctx.fillRect(rx,ry,dw,dh);
    txt('📷',cx,cy-dh*.06,`${dh*.14}px Arial`,'#fff','#fff',0);
    txt(p.name,cx,cy+dh*.10,`bold ${dh*.05}px Arial`,'#fff','#fff',5);
  }
  ctx.restore();

  // Accent border
  ctx.save();
  roundRect(rx-3,ry-3,dw+6,dh+6,rr+3);
  ctx.strokeStyle=p.accent;
  ctx.lineWidth=5;
  ctx.shadowColor=p.accent; ctx.shadowBlur=30;
  ctx.stroke();
  ctx.restore();

  ctx.restore();

  // Label under image — sized to fill the space down to the dot indicators,
  // not just hug the bottom of the photo with a small caption.
  // Always drawn fully opaque (not tied to the photo's fade level) since
  // showLabel already guarantees only one product's label is ever visible —
  // fading it too would just make it flash in dim instead of snapping in clean.
  if(!showLabel) return;
  ctx.save(); ctx.globalAlpha=1;
  const labelY=cy+dh/2+H*.045;
  const tw=W*.7,th=H*.04,tx=cx-tw/2,ty=labelY-th/2;
  ctx.fillStyle=`rgba(${r},${g2},${b},0.9)`;
  roundRect(tx,ty,tw,th,th/2); ctx.fill();

  const padW=W*.9; // max text width, leaves a small margin on both sides
  const tagSize =fitFontSize(p.tag,   900,`'Arial Black',Arial`, W*.048, tw*.85);
  const nameSize=fitFontSize(p.name,  900,`'Arial Black',Arial`, W*.135, padW);
  const brandSize=p.brand?fitFontSize(p.brand,'italic','Georgia,serif', W*.06, padW):0;
  const typeSize =p.type?fitFontSize(p.type,  900,'Arial',        W*.044, padW):0;

  txt(p.tag,cx,labelY,`900 ${tagSize}px 'Arial Black',Arial`,'#fff','#fff',3);
  txt(p.name,cx,labelY+H*.08,`900 ${nameSize}px 'Arial Black',Arial`,WHITE,p.accent,32);
  if(p.brand) txt(p.brand,cx,labelY+H*.155,`italic ${brandSize}px Georgia,serif`,GOLD,GOLD,12);
  if(p.type)  txt(p.type, cx,labelY+H*.20,`900 ${typeSize}px Arial`,'#aaa','#aaa',0);
  ctx.restore();
}

function renderCarousel(alpha, elapsed){
  ctx.save(); ctx.globalAlpha=alpha;
  txt('THIS WEEK\'S PICKS',W/2,H*.07,`900 ${W*.075}px 'Arial Black',Arial`,GOLD,GOLD,25);
  line(W*.1,H*.1,W*.9,H*.1,GREEN,.6);
  const N=carouselProducts.length;
  if(N===0){ txt('Add products in the editor',W/2,H*.5,`${W*.05}px Arial`,'#555','#555',0); ctx.restore(); return; }

  const t=elapsed%(CYCLE_SECS*N);
  const idx=Math.floor(t/CYCLE_SECS)%N;
  const within=t%CYCLE_SECS;
  const nextIdx=(idx+1)%N;
  const transProg = within<HOLD_SECS ? 0 : easeInOut((within-HOLD_SECS)/TRANS_SECS);

  if(transProg<=0){
    drawCarouselItem(carouselProducts[idx],1,true);
  } else {
    // Photo/glow cross-fade continuously, but the text label hard-cuts at
    // the halfway point — showing both products' labels blended together
    // mid-fade is unreadable, so only the dominant one ever draws text.
    drawCarouselItem(carouselProducts[idx],1-transProg,transProg<0.5);
    drawCarouselItem(carouselProducts[nextIdx],transProg,transProg>=0.5);
  }

  // Dot indicators
  const dotY=H*.87, ds=W*.045;
  for(let i=0;i<N;i++){
    const active=i===idx;
    ctx.save(); ctx.globalAlpha=alpha*(active?1:0.3);
    ctx.beginPath(); ctx.arc(W/2+(i-(N-1)/2)*ds,dotY,active?9:5.5,0,Math.PI*2);
    ctx.fillStyle=active?GREEN:'#555';
    ctx.shadowColor=GREEN; ctx.shadowBlur=active?14:0;
    ctx.fill(); ctx.shadowBlur=0; ctx.restore();
  }
  txt('✓  IN STORE NOW',W/2,H*.94,`900 ${W*.04}px 'Arial Black',Arial`,GREEN,GREEN,10);
  ctx.restore();
}

// ═══════════════════════════════════════════════════
//  SLIDE RENDERERS
// ═══════════════════════════════════════════════════
function renderSlide(idx, alpha, t, elapsed){
  const s=SLIDE_DEFS[idx];
  if(s.type==='carousel'){ renderCarousel(alpha,elapsed); return; }
  const f=k=>s.fields.find(x=>x.key===k)?.val||'';
  ctx.save(); ctx.globalAlpha=alpha;

  const name=s.name;
  if(name.includes('OPEN')){ // OPEN NOW
    // NOTE: order matters — "21+ WELCOME" contains "COME", so the 21+
    // check must run before the COME-IN check or it never matches.
    txt(f('top'),W/2,H*.13,`900 ${W*.046}px 'Arial Black',Arial`,WHITE,GREEN,15);
    line(W*.2,H*.22,W*.8,H*.22,GOLD,.7);
    const p=1+.025*Math.sin(t*.08);
    ctx.save();ctx.scale(p,p);
    txt(f('main'),W/2/p,H*.5/p,`900 ${W*.28}px 'Arial Black',Arial`,GREEN,GREEN,80);
    ctx.restore();
    txt(f('sub'),W/2,H*.73,`900 ${W*.12}px 'Arial Black',Arial`,GOLD,GOLD,40);
    line(W*.2,H*.83,W*.8,H*.83,GOLD,.7);
    txt(f('bottom'),W/2,H*.91,`900 ${W*.038}px 'Arial Black',Arial`,WHITE,GREEN,10);
  }
  else if(name.includes('21')){ // 21+
    txt(f('top'),W/2,H*.1,`900 ${W*.04}px 'Arial Black',Arial`,WHITE,GREEN,12);
    const p=1+.03*Math.sin(t*.07);
    ctx.save();ctx.scale(p,p);
    txt(f('big'),W/2/p,H*.46/p,`900 ${W*.38}px 'Arial Black',Arial`,GOLD,GOLD,100);
    ctx.restore();
    txt(f('sub'),W/2,H*.73,`900 ${W*.10}px 'Arial Black',Arial`,GREEN,GREEN,40);
    line(W*.2,H*.80,W*.8,H*.80,GOLD,.7);
    // Stacked (not side-by-side) — a narrow portrait canvas has no room
    // for two wide tag labels sitting next to each other.
    txt(f('tag1'),W/2,H*.855,`900 ${W*.05}px 'Arial Black',Arial`,WHITE,GREEN,8);
    txt('●',W/2,H*.878,`${W*.018}px Arial`,GREEN,GREEN,10);
    txt(f('tag2'),W/2,H*.905,`900 ${W*.05}px 'Arial Black',Arial`,WHITE,GREEN,8);
  }
  else if(name.includes('COME')){ // COME IN
    txt(f('top'),W/2,H*.12,`900 ${W*.042}px 'Arial Black',Arial`,GOLD,GOLD,20);
    line(W*.2,H*.21,W*.8,H*.21,WHITE,.5);
    txt(f('line1'),W/2,H*.41,`900 ${W*.20}px 'Arial Black',Arial`,WHITE,WHITE,50);
    txt(f('line2'),W/2,H*.62,`900 ${W*.20}px 'Arial Black',Arial`,GREEN,GREEN,60);
    line(W*.2,H*.76,W*.8,H*.76,WHITE,.5);
    txt(f('tagline'),W/2,H*.845,`italic ${W*.052}px Georgia,serif`,GREEN,GREEN,25);
    txt(f('bottom'),W/2,H*.93,`900 ${W*.036}px 'Arial Black',Arial`,WHITE,GREEN,8);
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════
//  TIMING — carousel gets its own duration
// ═══════════════════════════════════════════════════
function getSlideDur(){ return parseInt(document.getElementById('durSlider').value)||7; }
function getCarouselDur(){ return Math.max(getSlideDur(), carouselProducts.length*CYCLE_SECS+0.5); }
function getSlideDurations(){ return SLIDE_DEFS.map(s=>s.type==='carousel'?getCarouselDur():getSlideDur()); }
function getTotalSecs(){ return getSlideDurations().reduce((a,b)=>a+b,0); }

function getSlideInfo(elapsed){
  const durs=getSlideDurations();
  const total=durs.reduce((a,b)=>a+b,0);
  const pos=elapsed%total;
  let acc=0;
  for(let i=0;i<SLIDE_DEFS.length;i++){
    if(pos<acc+durs[i]){
      const within=pos-acc;
      const FADE=0.5;
      let alpha=1;
      if(within<FADE) alpha=within/FADE;
      else if(within>durs[i]-FADE) alpha=(durs[i]-within)/FADE;
      return{idx:i,within,alpha,dur:durs[i],pos,total};
    }
    acc+=durs[i];
  }
  const last=SLIDE_DEFS.length-1;
  return{idx:last,within:0,alpha:1,dur:durs[last],pos:total-0.01,total};
}

// ═══════════════════════════════════════════════════
//  RENDER LOOP
// ═══════════════════════════════════════════════════
function render(elapsed){
  const t=elapsed*30;
  const info=getSlideInfo(elapsed);
  ctx.clearRect(0,0,W,H);
  drawBg(); drawParticles();
  try{ renderSlide(info.idx,info.alpha,t,info.within); }catch(e){ console.error(e); }
  // Progress bar
  ctx.fillStyle='#111'; ctx.fillRect(0,H-8,W,8);
  const pg=ctx.createLinearGradient(0,0,W*(info.pos/info.total),0);
  pg.addColorStop(0,GREEN); pg.addColorStop(1,GOLD);
  ctx.shadowColor=GREEN; ctx.shadowBlur=12;
  ctx.fillStyle=pg; ctx.fillRect(0,H-8,W*(info.pos/info.total),8);
  ctx.shadowBlur=0;
}

let startTime=null;
function liveLoop(ts){
  if(!startTime)startTime=ts;
  render((ts-startTime)/1000);
  requestAnimationFrame(liveLoop);
}
requestAnimationFrame(liveLoop);

// Duration slider
document.getElementById('durSlider').addEventListener('input',function(){
  document.getElementById('durVal').textContent=this.value+'s';
  saveState();
});

// ═══════════════════════════════════════════════════
//  RECORD
// ═══════════════════════════════════════════════════
document.getElementById('recBtn').addEventListener('click',()=>{
  const btn=document.getElementById('recBtn');
  const st=document.getElementById('status');
  btn.disabled=true;
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
  const rec=new MediaRecorder(canvas.captureStream(30),{mimeType:mime,videoBitsPerSecond:8_000_000});
  const chunks=[];
  rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data);};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:mime});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='woodhaven_sign.webm'; a.click();
    URL.revokeObjectURL(a.href);
    st.textContent='✅ Video saved to Downloads!';
    btn.disabled=false; btn.textContent='⏺ RECORD & DOWNLOAD VIDEO';
  };
  const SECS=getTotalSecs()+0.5;
  const t0=performance.now();
  rec.start();
  function rl(ts){
    const el=(ts-t0)/1000;
    st.textContent=`⏺ Recording… ${Math.round(el/SECS*100)}%  (${Math.ceil(SECS-el)}s left)`;
    render(el);
    if(el<SECS) requestAnimationFrame(rl);
    else rec.stop();
  }
  requestAnimationFrame(rl);
});
</script>
